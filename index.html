<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 技能大赛备战站</title>
<style>
  :root{
    --bg:#f5f6f8; --bg2:#eceef1; --card:#ffffff; --card2:#eef0f3;
    --line:#e2e5ea; --txt:#24292f; --dim:#5f6b76; --dim2:#8b949e;
    --blue:#2563eb; --orange:#d97706; --green:#16a34a; --red:#dc2626;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.7}
  ::selection{background:#93c5fd80}

  header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  .logo{font-weight:800;font-size:17px;white-space:nowrap}
  .logo b{color:var(--blue)}
  .logo small{color:var(--dim2);font-weight:500;margin-left:8px}
  .ml-auto{margin-left:auto;display:flex;align-items:center;gap:10px}
  .badge{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge.ready{color:var(--green);border-color:#16a34a66;background:#16a34a1a}
  .badge.loading{color:var(--orange);border-color:#d9770666;background:#d977061a}
  .badge.err{color:var(--red);border-color:#dc262666;background:#dc26261a}
  #progressWrap{display:flex;align-items:center;gap:8px}
  #progressBar{width:110px;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
  #progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .3s}

  .wrap{display:flex;min-height:calc(100vh - 56px)}
  nav{width:290px;flex-shrink:0;border-right:1px solid var(--line);padding:16px 12px 40px;overflow-y:auto;max-height:calc(100vh - 56px);position:sticky;top:56px;background:var(--bg2)}
  main{flex:1;min-width:0;padding:28px 36px 80px;max-width:980px}
  @media(max-width:900px){
    nav{position:fixed;left:0;top:56px;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .25s;box-shadow:0 10px 30px #00000026}
    nav.open{transform:none}
    main{padding:20px 16px 60px}
    #menuBtn{display:inline-flex!important}
    #progressBar{width:60px}
  }

  .ch-group{margin-bottom:18px}
  .ch-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--dim2);padding:6px 10px}
  .ch-title .dot{width:8px;height:8px;border-radius:2px;background:var(--blue)}
  .ch-title[data-ch="2"] .dot{background:#22d3ee}
  .ch-title[data-ch="3"] .dot{background:#fb923c}
  .ch-title[data-ch="4"] .dot{background:#a78bfa}
  .ch-title[data-ch="5"] .dot{background:#f472b6}
  .ch-title[data-ch="6"] .dot{background:#34d399}
  .ch-title[data-ch="7"] .dot{background:#fbbf24}
  .ch-title[data-ch="8"] .dot{background:#f87171}
  .lesson{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:7px 10px;color:var(--dim);cursor:pointer;font-size:13.5px;font-family:inherit;transition:background .15s}
  .lesson:hover{background:#eef2f7}
  .lesson.active{background:#2563eb18;color:var(--txt);font-weight:600}
  .lesson .no{font-size:11.5px;color:var(--dim2);width:26px;flex-shrink:0;font-variant-numeric:tabular-nums}
  .lesson.active .no{color:var(--blue)}
  .lesson .dur{margin-left:auto;font-size:11px;color:var(--dim2);flex-shrink:0}
  .lesson .ck{font-size:12px;color:var(--green);flex-shrink:0}
  .nav-extra{margin-top:8px;border-top:1px solid var(--line);padding-top:12px}

  #article{animation:fadeIn .25s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sec-head{margin-bottom:20px}
  .sec-ch{font-size:12px;letter-spacing:3px;color:var(--dim2);font-weight:700;margin-bottom:6px}
  .sec-ch .hh{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:1px}
  h1{font-size:26px;font-weight:800;line-height:1.3;color:#111827}
  .sec-meta{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--dim)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0}
  .card h3{font-size:15px;font-weight:700;margin-bottom:12px;color:#1f2937;display:flex;align-items:center;gap:8px}
  .card h3 .ic{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .ic.blue{background:#0ea5e922;color:var(--blue)}
  .ic.np{background:#22d3ee22;color:#22d3ee}
  .ic.pd{background:#fb923c22;color:#fb923c}
  .ic.green{background:#34d39922;color:var(--green)}
  .ic.orange{background:#fbbf2422;color:var(--orange)}

  .points{list-style:none}
  .points>li{padding:7px 0 7px 26px;position:relative;color:#374151}
  .points>li::before{content:"";position:absolute;left:6px;top:17px;width:7px;height:7px;border-radius:2px;background:var(--blue);opacity:.7}
  .points b{color:#111827}
  .points code{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px;color:#c7254e;font-family:Consolas,"Courier New",monospace;word-break:break-all}
  .tip{background:#f9731610;border:1px solid #f9731633}
  .tip p{color:#374151;font-size:14.5px}
  .tip b{color:var(--orange)}

  .codeblock{border-radius:12px;overflow:hidden;border:1px solid #d4d4d8;margin:16px 0;background:#ffffff}
  .cb-head{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fafafa;border-bottom:1px solid #e2e5ea}
  .cb-title{font-size:13px;font-weight:600;color:#374151}
  .lbl{font-size:11px;background:#e5e7eb;border-radius:4px;padding:1px 7px;font-weight:700;margin-right:8px}
  .lbl.demo{color:#067d17} .lbl.exer{color:#b45309} .lbl.ans{color:#067d17} .lbl.ref{color:#6d28d9}
  .cb-note{margin-left:8px;font-size:11px;color:#8b949e}
  .cb-btns{margin-left:auto;display:flex;gap:8px}
  .btn{font-size:12.5px;font-family:inherit;border-radius:7px;padding:5px 14px;border:1px solid #d4d4d8;background:#f3f4f6;color:#374151;cursor:pointer;transition:all .15s;font-weight:600}
  .btn:hover{background:#e5e7eb}
  .btn.run{background:#2563eb;border-color:#2563eb;color:#ffffff}
  .btn.run:hover{background:#3b76f0}
  .btn.run:disabled{opacity:.5;cursor:wait}
  .btn.reset{background:none}
  .btn.copy{background:#f3f4f6;border-color:#d4d4d8;color:#374151}
  .codewrap{position:relative}
  .hlayer{position:absolute;inset:0;margin:0;padding:14px 16px;background:transparent;color:#1f2937;font-family:Consolas,"Courier New",monospace;font-size:13.5px;line-height:1.65;white-space:pre;overflow:hidden;pointer-events:none;tab-size:4;word-break:normal;box-sizing:border-box}
  .codearea{display:block;width:100%;border:none;background:transparent;color:transparent;caret-color:#1f2937;font-family:Consolas,"Courier New",monospace;font-size:13.5px;line-height:1.65;padding:14px 16px;outline:none;tab-size:4;white-space:pre;overflow-x:auto;min-height:110px;height:auto;field-sizing:content;resize:none;position:relative;z-index:1}
  .codearea::selection{background:rgba(37,99,235,.25)}
  .t-str{color:#067d17}
  .t-cmt{color:#8c8c8c;font-style:italic}
  .t-kw{color:#0033b3}
  .t-bi{color:#94558d}
  .t-num{color:#1750eb}
  .t-dec{color:#af00db}
  .output{margin:0;padding:12px 16px;background:#ffffff;border-top:1px solid #e2e5ea;color:#334155;font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all;min-height:20px;display:none}
  .output.show{display:block}
  .output.err{color:#dc2626}
  .output img{display:block;margin:10px auto;max-width:90%;border-radius:8px;border:1px solid var(--line)}
  .stat-msg{font-size:12px;color:#8f949a;padding:6px 16px;display:none}
  .stat-msg.show{display:block}

  .nav-next .btn.run{background:#2563eb;border-color:#2563eb;color:#ffffff}
  .nav-next .btn.run:hover{background:#3b76f0}

  .task{background:#f9731610;border:1px solid #f9731633;border-radius:12px;padding:16px 20px;margin:16px 0}
  .task h3{font-size:15px;font-weight:700;color:#c2410c;margin-bottom:8px}
  .task p{color:#374151;font-size:14.5px}
  .task .hint{font-size:13px;color:var(--dim);margin-top:8px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:12px;letter-spacing:1px;color:var(--dim2);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card2)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);color:#374151;vertical-align:top}
  td code{background:var(--card2);border-radius:4px;padding:1px 6px;font-size:12.5px;color:#c7254e;font-family:Consolas,monospace;word-break:break-all}
  tr:hover td{background:#f3f4f6}
  .sheet-section{margin:24px 0}
  .sheet-section h3{font-size:15px;margin-bottom:10px;color:#1f2937;border-left:3px solid var(--blue);padding-left:10px}

  .quiz-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:14px 0}
  .quiz-q{font-weight:600;color:#111827;margin-bottom:10px;font-size:14.5px}
  .quiz-q .qn{color:var(--blue);font-weight:800;margin-right:8px}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:6px 0;color:#374151;cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s}
  .opt:hover{border-color:#2563eb}
  .opt.chosen.correct{background:#16a34a22;border-color:var(--green);color:#15803d}
  .opt.chosen.wrong{background:#dc262622;border-color:var(--red);color:#b91c1c}
  .quiz-exp{display:none;margin-top:10px;font-size:13px;color:var(--dim);border-top:1px dashed var(--line);padding-top:10px}
  .quiz-exp.show{display:block}
  .quiz-exp b{display:block;margin-bottom:4px}

  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--dim2);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  footer a{color:var(--blue);text-decoration:none}
  #menuBtn{display:none;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:4px 12px;font-size:16px;cursor:pointer}
  #overlay{display:none;position:fixed;inset:0;background:#0008;z-index:35}
  @media(max-width:900px){#overlay.show{display:block}}

  .nav-next{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}

  .tk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:6px 0 10px}
  .tk-btn{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-family:inherit;transition:all .15s}
  .tk-btn:hover{border-color:var(--blue)}
  .tk-btn b{display:block;font-size:14px;color:var(--txt)}
  .tk-btn small{font-size:12px;color:var(--dim)}
  .tk-note{font-size:13px;color:var(--dim);margin-top:10px}
  #tk-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .tk-progress{font-size:13px;color:var(--dim);margin-left:auto;font-weight:700}
  .tk-opt.tk-on{border-color:var(--blue);background:#2563eb14;color:var(--txt);font-weight:600}
  .tk-subrow{margin-top:8px}
  .tk-hint{font-size:12px;color:var(--orange);margin-top:6px}
  .tk-judge{display:flex;gap:10px;margin-top:6px}
  .tk-judge .opt{flex:1;text-align:center;font-size:14px}
  .tk-ans{margin-top:10px;font-size:13.5px;color:var(--green);font-weight:700}
  .tk-wrong-list{font-size:13px;color:var(--dim);margin-top:6px}
  .tk-result h3{margin-bottom:8px}
  .tk-result .btn{color:var(--txt)}
</style>

<script>
/* ============ Pyodide 引擎 ============ */
const PYODIDE_VERSION = "v314.0.5";
const PYODIDE_BASE = "https://cdn.jsdelivr.net/pyodide/" + PYODIDE_VERSION + "/full/";
let pyodide = null, pyInit = null;

function setBadge(state, text){
  const b = document.getElementById("statusBadge");
  b.className = "badge " + state;
  b.textContent = text;
}

function ensurePyodide(pkgs){
  const need = pkgs || [];
  const run = () => {
    const loaded = pyodide.loadedPackages || {};
    const miss = need.filter(p => !loaded[p] && !loaded[p + "-js"]);
    if(miss.length) return pyodide.loadPackage(miss);
    return Promise.resolve();
  };
  return initPyodide().then(run);
}

const DATA_FILES = [
  "EcommerceUser.csv", "ShortVideo.csv",
  "SweeperRobot.csv", "SweeperAfterSale.csv",
  "hotel.csv", "shopping.csv", "lab4f.csv", "lab5f.csv"
];

async function preloadData(py){
  const fail = [];
  for(const f of DATA_FILES){
    try {
      const res = await fetch("data/" + f);
      if(!res.ok) throw new Error("HTTP " + res.status);
      const buf = new Uint8Array(await res.arrayBuffer());
      py.FS.writeFile("/home/pyodide/" + f, buf);
    } catch(e){ fail.push(f); }
  }
  return fail;
}

function initPyodide(){
  if(!pyInit){
    pyInit = (async () => {
      setBadge("loading", "⏳ 加载 Python 运行时（首次约10MB）…");
      await new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = PYODIDE_BASE + "pyodide.js";
        s.onload = res;
        s.onerror = () => rej(new Error("Pyodide CDN 加载失败，请检查网络"));
        document.head.appendChild(s);
      });
      pyodide = await loadPyodide({ indexURL: PYODIDE_BASE });
      await pyodide.loadPackage(["numpy", "pandas", "matplotlib"]);
      await pyodide.runPythonAsync([
        "import io, base64",
        "import matplotlib",
        "matplotlib.use('Agg')",
        "import matplotlib.pyplot as plt",
        "_plt_img_hooks = []",
        "def _show_hook(*a, **k):",
        "    buf = io.BytesIO()",
        "    plt.savefig(buf, format='png', bbox_inches='tight', dpi=110)",
        "    plt.close('all')",
        "    _plt_img_hooks.append(base64.b64encode(buf.getvalue()).decode())",
        "plt.show = _show_hook"
      ].join("\n"));
      const fail = await preloadData(pyodide);
      if(fail.length){
        setBadge("err", "✖ 运行时就绪，数据缺失: " + fail.join("、"));
      } else {
        setBadge("ready", "✔ 运行时就绪");
      }
      return pyodide;
    })().catch(e => { setBadge("err", "✖ 运行时加载失败"); throw e; });
  }
  return pyInit;
}

async function runCode(btn){
  const block = btn.closest(".codeblock");
  const ta = block.querySelector("textarea");
  const out = block.querySelector(".output");
  const stat = block.querySelector(".stat-msg");
  const code = ta.value;
  out.textContent = ""; out.className = "output show";
  stat.textContent = ""; stat.className = "stat-msg";
  btn.disabled = true; btn.textContent = "运行中…";
  try {
    const pkgs = (block.dataset.pkgs || "").split(",").filter(Boolean);
    await ensurePyodide(pkgs);
    await pyodide.runPythonAsync("import io, sys; _buf = io.StringIO(); _old = (sys.stdout, sys.stderr); sys.stdout = _buf; sys.stderr = _buf");
    await pyodide.runPythonAsync(code);
    const txt = await pyodide.runPythonAsync("_buf.getvalue()");
    const imgs = await pyodide.runPythonAsync("list(_plt_img_hooks)");
    await pyodide.runPythonAsync("sys.stdout, sys.stderr = _old");
    renderOutput(out, txt, imgs);
  } catch(e){
    await pyodide.runPythonAsync("sys.stdout, sys.stderr = _old").catch(() => {});
    out.textContent = String((e && e.message) || e);
    out.className = "output show err";
    const msg = (e && e.message || String(e)).split("\n").pop().slice(0, 120);
    stat.textContent = "✖ " + msg;
    stat.className = "stat-msg show";
  } finally {
    btn.disabled = false; btn.textContent = "▶ 运行";
  }
}

function renderOutput(out, txt, imgs){
  if(imgs && imgs.length){
    out.textContent = txt || "（输出见下图）";
    imgs.forEach(b64 => {
      const img = document.createElement("img");
      img.src = "data:image/png;base64," + b64;
      img.alt = "绘图输出";
      out.appendChild(img);
    });
  } else {
    out.textContent = txt || "（无输出）";
  }
  out.className = "output show";
}

function resetCode(btn){
  const block = btn.closest(".codeblock");
  const ta = block.querySelector("textarea");
  ta.value = block.dataset.orig;
  autoGrow(ta); refreshHL(ta);
  const out = block.querySelector(".output");
  out.textContent = ""; out.className = "output";
  const stat = block.querySelector(".stat-msg");
  stat.textContent = ""; stat.className = "stat-msg";
}

function esc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function codeblockHTML(title, lblClass, code, opts){
  opts = opts || {};
  const pkgsAttr = opts.pkgs ? ' data-pkgs="' + esc(opts.pkgs) + '"' : "";
  let btns = '';
  if(opts.ref){
    btns = '<button class="btn copy" onclick="copyCode(this)">📋 复制</button>' +
      '<span class="cb-note">参考代码，需在比赛环境（Anaconda）本地运行</span>';
  } else {
    btns = '<button class="btn reset" onclick="resetCode(this)">↺ 重置</button>' +
      '<button class="btn run" onclick="runCode(this)">▶ 运行</button>';
  }
  return '<div class="codeblock"' + pkgsAttr + ' data-orig="' + esc(code) + '">' +
    '<div class="cb-head">' +
      '<span class="cb-title"><span class="lbl ' + lblClass + '">' + title + '</span></span>' +
      '<div class="cb-btns">' + btns + '</div>' +
    '</div>' +
    '<div class="codewrap">' +
      '<pre class="hlayer" aria-hidden="true"></pre>' +
      '<textarea class="codearea" spellcheck="false" oninput="autoGrow(this);refreshHL(this)" onscroll="syncHL(this)">' + esc(code) + '</textarea>' +
    '</div>' +
    '<pre class="output"></pre>' +
    '<div class="stat-msg"></div>' +
  '</div>';
}

function autoGrow(ta){
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}

function hlPython(code){
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const KW = "and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield True False None";
  const BI = "print len range int float str list dict set tuple bool input open isinstance super map filter sorted zip enumerate round abs sum min max type repr format join split strip append pop replace value_counts mean std count drop fillna read_csv to_csv head isna unique to_string read_excel groupby astype reset_index set_index";
  const re = new RegExp(
    "('''[\\s\\S]*?'''|\"\"\"[\\s\\S]*?\"\"\"|'(?:\\\\.|[^'\\\\\\n])*'|\"(?:\\\\.|[^\"\\\\\\n])*\")" +
    "|(#.*$)" +
    "|(\\b(?:" + KW.split(" ").join("|") + ")\\b)" +
    "|(\\b(?:" + BI.split(" ").join("|") + ")\\b)" +
    "|(\\b\\d+(?:\\.\\d+)?\\b)" +
    "|(@\\w+)" +
    "|([\\s\\S])", "gm");
  return code.replace(re, (m, s1, s2, s3, s4, s5, s6, s7) => {
    if(s1) return '<span class="t-str">' + esc(s1) + '</span>';
    if(s2) return '<span class="t-cmt">' + esc(s2) + '</span>';
    if(s3) return '<span class="t-kw">' + esc(s3) + '</span>';
    if(s4) return '<span class="t-bi">' + esc(s4) + '</span>';
    if(s5) return '<span class="t-num">' + esc(s5) + '</span>';
    if(s6) return '<span class="t-dec">' + esc(s6) + '</span>';
    return esc(s7);
  });
}

function refreshHL(ta){
  const hl = ta.parentElement.querySelector(".hlayer");
  if(!hl) return;
  try {
    hl.innerHTML = hlPython(ta.value);
  } catch(e){
    hl.innerHTML = esc(ta.value);
  }
}

function syncHL(ta){
  const hl = ta.parentElement.querySelector(".hlayer");
  if(!hl) return;
  hl.scrollTop = ta.scrollTop;
  hl.scrollLeft = ta.scrollLeft;
}

function copyCode(btn){
  const block = btn.closest(".codeblock");
  const ta = block.querySelector("textarea");
  const ok = () => { btn.textContent = "✔ 已复制"; setTimeout(() => { btn.textContent = "📋 复制"; }, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(ok).catch(() => { ta.select(); document.execCommand("copy"); ok(); });
  } else {
    ta.select(); document.execCommand("copy"); ok();
  }
}


/* ============ 渲染 ============ */
function renderNav(activeId){
  const nav = document.getElementById("nav");
  let html = "";
  Object.keys(CH).forEach(ch => {
    const items = LES.filter(l => l.ch === ch);
    if(!items.length) return;
    html += '<div class="ch-group"><div class="ch-title" data-ch="' + ch + '"><span class="dot"></span>' + CH[ch].name + ' · ' + items.length + '节</div>';
    items.forEach(l => {
      const done = isDone(l.id);
      html += '<button class="lesson' + (l.id === activeId ? " active" : "") + '" onclick="goto(\'' + l.id + '\')">' +
        '<span class="no">' + l.no + '</span><span>' + esc(l.title) + '</span>' +
        (done ? '<span class="ck">✔</span>' : '') +
        '<span class="dur">' + l.dur + '</span></button>';
    });
    html += '</div>';
  });
  html += '<div class="nav-extra">' +
    '<button class="lesson' + (activeId === "_map" ? " active" : "") + '" onclick="goto(\'_map\')"><span class="no">🗺</span><span>竞赛交付地图</span></button>' +
    '<button class="lesson' + (activeId === "_sheet" ? " active" : "") + '" onclick="goto(\'_sheet\')"><span class="no">📋</span><span>API 速查表</span></button>' +
    '<button class="lesson' + (activeId === "_quiz" ? " active" : "") + '" onclick="goto(\'_quiz\')"><span class="no">🎯</span><span>自测题</span></button>' +
    '</div>';
  nav.innerHTML = html;
}

function isDone(id){
  try { return (JSON.parse(localStorage.getItem("np_done") || "[]")).includes(id); } catch(e){ return false; }
}

function toggleDone(id){
  let a = []; try { a = JSON.parse(localStorage.getItem("np_done") || "[]"); } catch(e){}
  const i = a.indexOf(id);
  if(i >= 0) a.splice(i, 1); else a.push(id);
  localStorage.setItem("np_done", JSON.stringify(a));
  updateProgress();
  renderNav(id);
  const b2 = document.getElementById("doneBtn");
  if(b2){ b2.textContent = isDone(id) ? "✔ 已学会" : "标记学会了"; }
}

function updateProgress(){
  const total = LES.length;
  let done = 0;
  LES.forEach(l => { if(isDone(l.id)) done++; });
  document.getElementById("progressFill").style.width = (done / total * 100) + "%";
  document.getElementById("progressNum").textContent = done + "/" + total;
}

function lessonHTML(l){
  const colorMap = {"1":"#38bdf8","2":"#22d3ee","3":"#fb923c","4":"#a78bfa","5":"#f472b6","6":"#34d399","7":"#fbbf24","8":"#f87171"};
  const chColor = colorMap[l.ch] || "#38bdf8";
  let html = '<div id="article">' +
    '<div class="sec-head">' +
      '<div class="sec-ch"><span class="hh" style="background:' + chColor + '"></span>' + CH[l.ch].name + ' · 第 ' + l.no + ' 课 · ' + l.dur + '</div>' +
      '<h1>' + esc(l.title) + '</h1>' +
      '<div class="sec-meta"><span class="tag">' + esc(l.tag || "") + '</span>' +
      '<span class="tag" style="cursor:pointer" onclick="toggleDone(\'' + l.id + '\')" id="doneBtn">' + (isDone(l.id) ? "✔ 已学会" : "标记学会了") + '</span></div>' +
    '</div>';
  if(l.lead) html += '<div class="card"><p style="color:#374151">' + l.lead + '</p></div>';
  if(l.points && l.points.length){
    html += '<div class="card"><h3><span class="ic blue">📌</span>核心知识点</h3><ul class="points">';
    l.points.forEach(p => { html += '<li>' + p + '</li>'; });
    html += '</ul></div>';
  }
  if(l.tip) html += '<div class="card tip"><h3><span class="ic orange">⚡</span>比赛提效提示</h3><p>' + l.tip + '</p></div>';
  if(l.demos) l.demos.forEach(d => { html += codeblockHTML(d.title, "demo", d.code, {pkgs: d.pkgs}); });
  if(l.refs) l.refs.forEach(r => { html += codeblockHTML(r.title, "ref", r.code, {ref: true}); });
  if(l.steps) l.steps.forEach(s => {
    html += '<div class="sheet-section"><h3>' + esc(s.title) + '</h3><div class="card" style="padding:0;overflow:hidden"><table><tr>' +
      s.head.map(h => '<th>' + h + '</th>').join("") + '</tr>';
    s.rows.forEach(r => {
      html += '<tr><td style="white-space:nowrap;color:#111827">' + r[0] + '</td><td>' + r[1] + '</td></tr>';
    });
    html += '</table></div></div>';
  });
  if(l.exercise){
    html += '<div class="task"><h3>🏋 练一练</h3><p>' + l.exercise.task + '</p>' +
      '<p class="hint">提示：在下方代码区动手修改，点运行看结果。先自己写，再对照参考答案。</p></div>';
    html += codeblockHTML("练习区", "exer", l.exercise.starter || "import numpy as np\nimport pandas as pd\n");
    if(l.exercise.solution) html += codeblockHTML("参考答案（先自己做再看）", "ans", l.exercise.solution);
  }
  if(l.next){
    html += '<div class="nav-next">' +
      (l.prev ? '<button class="btn" onclick="goto(\'' + l.prev + '\')">← ' + l.prevNo + ' ' + esc(l.prevTitle) + '</button>' : '<span></span>') +
      '<button class="btn run" onclick="goto(\'' + l.next + '\')">下一课：' + l.nextNo + ' ' + esc(l.nextTitle) + ' →</button>' +
    '</div>';
  }
  html += '</div>';
  return html;
}

function sheetHTML(){
  let html = '<div id="article"><div class="sec-head">' +
    '<div class="sec-ch"><span class="hh" style="background:#c4b5fd"></span>比赛速查</div>' +
    '<h1>API 速查表</h1><div class="sec-meta"><span class="tag">按用途查写法</span><span class="tag">开卷武器，现场对照</span></div></div>' +
    '<div class="card" style="background:#8b5cf60d;border-color:#8b5cf633"><p style="color:#374151">数据清洗、特征构造、结果整理靠 pandas，数值计算、矩阵运算靠 numpy。所有写法都可以在对应课程里实际运行验证。</p></div>';
  SHEET.forEach(s => {
    html += '<div class="sheet-section"><h3>' + esc(s.title) + '</h3><div class="card" style="padding:0;overflow:hidden"><table><tr>' +
      s.head.map(h => '<th>' + h + '</th>').join("") + '</tr>';
    s.rows.forEach(r => {
      html += '<tr><td style="white-space:nowrap;color:#111827">' + r[0] + '</td><td>' + r[1] + '</td></tr>';
    });
    html += '</table></div></div>';
  });
  html += '</div>';
  return html;
}

function quizHTML(){
  let html = '<div id="article"><div class="sec-head">' +
    '<div class="sec-ch"><span class="hh" style="background:#34d399"></span>自测</div>' +
    '<h1>自测题</h1><div class="sec-meta"><span class="tag">' + QUIZ.length + ' 题 · 点击选项即时对答案</span></div></div>' +
    '<p style="color:var(--dim)">全部做对，说明本章语法已经过关，可以放心上赛场。做错了的，回对应课程再跑一遍代码。</p>';
  QUIZ.forEach((q, i) => {
    html += '<div class="quiz-item"><div class="quiz-q"><span class="qn">Q' + (i + 1) + '</span>' + esc(q.q) + '</div>';
    q.opts.forEach((o, j) => {
      html += '<button class="opt" onclick="pick(this,' + i + ',' + j + ')">' + String.fromCharCode(65 + j) + '. ' + esc(o) + '</button>';
    });
    html += '<div class="quiz-exp" id="exp' + i + '"><b>解析</b>' + esc(q.exp) + '</div></div>';
  });
  html += '</div>';
  return html;
}

function pick(btn, qi, oi){
  const item = btn.closest(".quiz-item");
  const q = QUIZ[qi];
  item.querySelectorAll(".opt").forEach(b => { b.className = "opt"; b.disabled = true; });
  btn.className = "opt chosen " + (oi === q.ans ? "correct" : "wrong");
  if(oi !== q.ans) item.querySelectorAll(".opt")[q.ans].className = "opt chosen correct";
  document.getElementById("exp" + qi).className = "quiz-exp show";
}

function goto(id){
  const main = document.getElementById("main");
  if(id === "_sheet") main.innerHTML = sheetHTML();
  else if(id === "_quiz") main.innerHTML = quizHTML();
  else if(id === "_map") main.innerHTML = MAP.render();
  else if(id === "_tiku") main.innerHTML = TIKU.render();
  else {
    const l = LES.find(x => x.id === id);
    if(l) main.innerHTML = lessonHTML(l);
  }
  document.querySelectorAll(".codearea").forEach(ta => { autoGrow(ta); refreshHL(ta); });
  renderNav(id);
  window.scrollTo(0, 0);
  closeNav();
  updateProgress();
}

function toggleNav(){ document.getElementById("nav").classList.toggle("open"); document.getElementById("overlay").classList.toggle("show"); }
function closeNav(){ document.getElementById("nav").classList.remove("open"); document.getElementById("overlay").classList.remove("show"); }

LES.forEach((l, i) => {
  const list = LES.filter(x => x.ch === l.ch);
  const idx = list.indexOf(l);
  if(idx < list.length - 1){
    l.next = list[idx + 1].id; l.nextNo = list[idx + 1].no; l.nextTitle = list[idx + 1].title;
  }
  if(idx > 0){
    l.prev = list[idx - 1].id; l.prevNo = list[idx - 1].no; l.prevTitle = list[idx - 1].title;
  }
});

updateProgress();
renderNav("");
goto(LES.length ? LES[0].id : "_sheet");
</script>
